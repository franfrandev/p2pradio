[package]
name = "p2pradio"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libp2p = { version = "0.57.0", features = ["macros", "mdns", "gossipsub", "yamux", "quic", "tokio", "tcp", "noise", "kad", "identify", "ping"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
clap = { version = "4.6.1", features = ["derive"] }
jsonrpsee = { version = "0.26.0", features = ["full"] }
thiserror = "2.0.20"
